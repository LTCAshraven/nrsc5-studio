[package]
name = "nrsc5-studio"
version = "0.3.7"
edition = "2021"
authors = ["LTCAshraven"]
license = "MIT"
description = "Native desktop application for HD Radio FM reception with RTL-SDR or SDRplay receivers, built on nrsc5 and SoapySDR."
repository = "https://github.com/LTCAshraven/nrsc5-studio"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5"
dirs = "6"
eframe = { version = "0.34", features = ["persistence"] }
egui = "0.34"
egui_dock = { version = "0.19", features = ["serde"] }
egui_extras = { version = "0.34", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libloading = "0.8"
# v0.3.0: num-complex pairs with the `soapysdr` crate, which streams
# samples as `Complex<i8>` / `Complex<i16>` / `Complex<f32>` depending
# on what the device negotiates. We keep CS8 as our preferred wire
# format (byte-for-byte equivalent to librtlsdr's CU8 after a +128
# offset adjustment) and fall back to CS16 for devices that don't
# advertise CS8 natively (SDRplay).
num-complex = { version = "0.4", default-features = false }
ron = "0.8"
# v0.3.1: rubato gives us a high-quality fractional resampler for the
# SDRplay path. SDRplay's lowest supported sample rates are
# {62.5, 96, 125, 192, 250, 384, 500, 768, 1000} ksps (discrete) and
# then a continuous range starting at 2 Msps. nrsc5 requires exactly
# 1.488375 Msps, which falls in a gap. We open SDRplay at 2 Msps and
# resample down to 1.488375 Msps in software with `SincFixedIn`. The
# `fft_resampler` feature is off; we only need the time-domain sinc
# resampler which has no extra deps beyond `num-traits`.
rubato = { version = "0.16", default-features = false }
rustfft = { version = "6", default-features = false }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
# v0.3.0: single unified SDR backend over libSoapySDR. Replaces the
# direct librtlsdr binding for RTL-SDR users and brings SDRplay /
# Airspy / HackRF / Lime / Pluto / network SDRs under one trait. The
# import library and headers are staged into the bundled llvm-mingw
# toolchain by `scripts/install-soapysdr-msys2.ps1` — run that script
# once before the first build.
soapysdr = "0.4"
thiserror = "2"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[build-dependencies]
bindgen = "0.72"
# Used by build.rs to procedurally generate a multi-resolution Windows icon
# and embed it as a resource in the final .exe. Only active on Windows
# targets — see build.rs for the cfg gate.
image = { version = "0.25", default-features = false }
ico = "0.4"
embed-resource = "3"

[profile.release]
opt-level = "z"      # Optimize for size
lto = true           # Link-time optimization
codegen-units = 1    # Better optimization (slower compile, smaller binary)
strip = true         # Strip debug symbols
panic = "abort"      # No unwinding (smaller binary; fine for a GUI app)

# -----------------------------------------------------------------------------
# Linux packaging metadata
# -----------------------------------------------------------------------------
# Drives `cargo deb` (Debian/Ubuntu) and `cargo generate-rpm` (Fedora /
# RHEL-family). Both tools read the corresponding `[package.metadata.*]`
# section below and assemble an installable package from `target/release/`.
#
# Build prerequisites on the host running the package build:
#   cargo install cargo-deb cargo-generate-rpm
#   apt-get install -y dpkg-dev fakeroot lintian      # Debian/Ubuntu side
#   dnf install -y rpm-build rpmlint                  # Fedora side
#
# Build the packages with:
#   cargo build --release
#   cargo deb --no-build               # produces target/debian/*.deb
#   cargo generate-rpm                 # produces target/generate-rpm/*.rpm
#
# The convenience wrapper at scripts/build-linux-packages.sh runs all
# three steps in order and prints the artifact paths.
#
# Runtime dependencies are intentionally not enumerated as `depends = …`
# here — `cargo deb` runs `dpkg-shlibdeps` against the linked binary and
# generates an accurate, per-host dependency list. The same approach is
# used by every well-behaved Debian package. The `recommends` list below
# is for non-shlibdep optional helpers (SDR driver modules).
#
# The end-user nrsc5 helper is *not* a package dependency — it isn't
# packaged in Debian or Ubuntu, and bundling it would create AGPL/MIT
# license-mixing concerns. Instead the post-install README and a first-
# launch in-app dialog point the user at the install-nrsc5-helper.sh
# script shipped at /usr/share/nrsc5-studio/install-nrsc5-helper.sh.

[package.metadata.deb]
maintainer = "LTCAshraven <LTCAshraven@users.noreply.github.com>"
copyright = "2026, LTCAshraven <LTCAshraven@users.noreply.github.com>"
license-file = ["LICENSE", "0"]
# Point cargo-deb at our hand-maintained Debian changelog so the binary
# package ships /usr/share/doc/nrsc5-studio/changelog.Debian.gz (Debian
# Policy 12.7) instead of erroring out as a non-native package with no
# changelog.
changelog = "packaging/debian/changelog"
extended-description = """\
A native desktop application for listening to HD Radio FM broadcasts
(87.5-108 MHz) with an RTL-SDR, SDRplay, or HackRF One software-defined
radio. Built around the open-source nrsc5 demodulator and the SoapySDR
device layer, with a dockable GUI that adds presets, an album-art
collage, a 24-hour song log, live spectrum/waterfall/QPSK scopes,
closed-loop AGC, TPEG traffic decoding, and weather-radar animation.

The separate nrsc5 helper binary (https://github.com/theori-io/nrsc5)
is required at runtime and is not packaged in Debian or Ubuntu. A
convenience installer is shipped at
/usr/share/nrsc5-studio/install-nrsc5-helper.sh."""
section = "sound"
priority = "optional"
recommends = "soapysdr-module-rtlsdr, soapysdr-tools, rtl-sdr"
suggests = "pulseaudio-utils, pipewire-pulse"
assets = [
    ["target/release/nrsc5-studio", "usr/bin/", "755"],
    ["packaging/linux/nrsc5-studio.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/io.github.ltcashraven.Nrsc5Studio.metainfo.xml", "usr/share/metainfo/", "644"],
    ["packaging/linux/icons/hicolor/16x16/apps/nrsc5-studio.png", "usr/share/icons/hicolor/16x16/apps/nrsc5-studio.png", "644"],
    ["packaging/linux/icons/hicolor/32x32/apps/nrsc5-studio.png", "usr/share/icons/hicolor/32x32/apps/nrsc5-studio.png", "644"],
    ["packaging/linux/icons/hicolor/48x48/apps/nrsc5-studio.png", "usr/share/icons/hicolor/48x48/apps/nrsc5-studio.png", "644"],
    ["packaging/linux/icons/hicolor/64x64/apps/nrsc5-studio.png", "usr/share/icons/hicolor/64x64/apps/nrsc5-studio.png", "644"],
    ["packaging/linux/icons/hicolor/128x128/apps/nrsc5-studio.png", "usr/share/icons/hicolor/128x128/apps/nrsc5-studio.png", "644"],
    ["packaging/linux/icons/hicolor/256x256/apps/nrsc5-studio.png", "usr/share/icons/hicolor/256x256/apps/nrsc5-studio.png", "644"],
    ["packaging/linux/nrsc5-studio.1", "usr/share/man/man1/nrsc5-studio.1", "644"],
    ["scripts/install-nrsc5-helper.sh", "usr/share/nrsc5-studio/install-nrsc5-helper.sh", "755"],
    ["README.md", "usr/share/doc/nrsc5-studio/README.md", "644"],
    ["docs/linux-install.md", "usr/share/doc/nrsc5-studio/linux-install.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/nrsc5-studio/CHANGELOG.md", "644"],
]

# `cargo-generate-rpm` lays out the package against the same `assets` from
# `[package.metadata.deb]` by default, but we redeclare here so the spec
# is self-contained and so the file modes / paths land in Fedora's
# /usr-merged conventions explicitly (cargo-generate-rpm currently does
# not auto-translate Debian-style paths).
[package.metadata.generate-rpm]
license = "MIT"
summary = "HD Radio FM receiver and station explorer built on nrsc5 and SoapySDR"
# `requires` is intentionally minimal — rpmbuild's automatic
# dependency generator picks up shared-library NEEDED entries from
# the binary at build time and emits the right `Requires:` lines.
# `recommends` / `suggests` (weak deps) point at the SDR driver
# modules; they're modeled as TOML sub-tables further down.
post_install_script = """if [ -x /usr/bin/update-desktop-database ]; then /usr/bin/update-desktop-database -q /usr/share/applications 2>/dev/null || true; fi
if [ -x /usr/bin/gtk-update-icon-cache ]; then /usr/bin/gtk-update-icon-cache -q /usr/share/icons/hicolor 2>/dev/null || true; fi
"""
post_uninstall_script = """if [ -x /usr/bin/update-desktop-database ]; then /usr/bin/update-desktop-database -q /usr/share/applications 2>/dev/null || true; fi
if [ -x /usr/bin/gtk-update-icon-cache ]; then /usr/bin/gtk-update-icon-cache -q /usr/share/icons/hicolor 2>/dev/null || true; fi
"""

# Weak deps. cargo-generate-rpm models these as TOML tables where the
# key is the package name and the value is a version constraint
# (`"*"` = any).
[package.metadata.generate-rpm.recommends]
soapysdr = "*"

# Fedora packages source the soapysdr modules from `soapysdr` itself
# rather than a separate package; rtl-sdr ships in `rtl-sdr`.
[package.metadata.generate-rpm.suggests]
rtl-sdr = "*"
pipewire-pulseaudio = "*"

[[package.metadata.generate-rpm.assets]]
source = "target/release/nrsc5-studio"
dest = "/usr/bin/nrsc5-studio"
mode = "755"

[[package.metadata.generate-rpm.assets]]
source = "packaging/linux/nrsc5-studio.desktop"
dest = "/usr/share/applications/nrsc5-studio.desktop"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/linux/io.github.ltcashraven.Nrsc5Studio.metainfo.xml"
dest = "/usr/share/metainfo/io.github.ltcashraven.Nrsc5Studio.metainfo.xml"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/linux/icons/hicolor/16x16/apps/nrsc5-studio.png"
dest = "/usr/share/icons/hicolor/16x16/apps/nrsc5-studio.png"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/linux/icons/hicolor/32x32/apps/nrsc5-studio.png"
dest = "/usr/share/icons/hicolor/32x32/apps/nrsc5-studio.png"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/linux/icons/hicolor/48x48/apps/nrsc5-studio.png"
dest = "/usr/share/icons/hicolor/48x48/apps/nrsc5-studio.png"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/linux/icons/hicolor/64x64/apps/nrsc5-studio.png"
dest = "/usr/share/icons/hicolor/64x64/apps/nrsc5-studio.png"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/linux/icons/hicolor/128x128/apps/nrsc5-studio.png"
dest = "/usr/share/icons/hicolor/128x128/apps/nrsc5-studio.png"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/linux/icons/hicolor/256x256/apps/nrsc5-studio.png"
dest = "/usr/share/icons/hicolor/256x256/apps/nrsc5-studio.png"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/linux/nrsc5-studio.1"
dest = "/usr/share/man/man1/nrsc5-studio.1"
mode = "644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "scripts/install-nrsc5-helper.sh"
dest = "/usr/share/nrsc5-studio/install-nrsc5-helper.sh"
mode = "755"

[[package.metadata.generate-rpm.assets]]
source = "README.md"
dest = "/usr/share/doc/nrsc5-studio/README.md"
mode = "644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "docs/linux-install.md"
dest = "/usr/share/doc/nrsc5-studio/linux-install.md"
mode = "644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "CHANGELOG.md"
dest = "/usr/share/doc/nrsc5-studio/CHANGELOG.md"
mode = "644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "LICENSE"
dest = "/usr/share/licenses/nrsc5-studio/LICENSE"
mode = "644"
doc = true
