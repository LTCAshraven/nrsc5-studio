[package]
name = "nrsc5-studio"
version = "0.3.8"
edition = "2021"
authors = ["LTCAshraven"]
license = "MIT"
description = "A native Windows desktop app for listening to HD Radio broadcasts with an RTL-SDR or SDRplay dongle, built on nrsc5 and SoapySDR."
repository = "https://github.com/LTCAshraven/nrsc5-studio"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# v0.3.8 (Phase 1 audio refactor): cpal owns the system audio output
# stream now that `nrsc5.exe` is invoked with `-o -` and emits raw s16le
# 44.1 kHz stereo PCM on stdout. This replaces the libao path that
# nrsc5 used to drive itself, and retires `src/winaudio/`, `src/linaudio.rs`,
# and `src/audioctl.rs` (which only existed to *control* libao's WASAPI /
# pactl session — they had no PCM responsibilities of their own). Picking
# cpal here also makes the eventual Linux build path near-free.
cpal = "0.15"
crossbeam-channel = "0.5"
dirs = "6"
eframe = { version = "0.34", features = ["persistence"] }
egui = "0.34"
egui_dock = { version = "0.19", features = ["serde"] }
egui_extras = { version = "0.34", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libloading = "0.8"
# v0.3.0: num-complex pairs with the `soapysdr` crate, which streams
# samples as `Complex<i8>` / `Complex<i16>` / `Complex<f32>` depending
# on what the device negotiates. We keep CS8 as our preferred wire
# format (byte-for-byte equivalent to librtlsdr's CU8 after a +128
# offset adjustment) and fall back to CS16 for devices that don't
# advertise CS8 natively (SDRplay).
num-complex = { version = "0.4", default-features = false }
ron = "0.8"
# v0.3.1: rubato gives us a high-quality fractional resampler for the
# SDRplay path. SDRplay's lowest supported sample rates are
# {62.5, 96, 125, 192, 250, 384, 500, 768, 1000} ksps (discrete) and
# then a continuous range starting at 2 Msps. nrsc5 requires exactly
# 1.488375 Msps, which falls in a gap. We open SDRplay at 2 Msps and
# resample down to 1.488375 Msps in software with `SincFixedIn`. The
# `fft_resampler` feature is off; we only need the time-domain sinc
# resampler which has no extra deps beyond `num-traits`.
rubato = { version = "0.16", default-features = false }
rustfft = { version = "6", default-features = false }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
# v0.3.0: single unified SDR backend over libSoapySDR. Replaces the
# direct librtlsdr binding for RTL-SDR users and brings SDRplay /
# Airspy / HackRF / Lime / Pluto / network SDRs under one trait. The
# import library and headers are staged into the bundled llvm-mingw
# toolchain by `scripts/install-soapysdr-msys2.ps1` — run that script
# once before the first build.
soapysdr = "0.4"
thiserror = "2"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false }
# v0.4.0: removed `windows = "0.62"` entirely. The only consumer in this
# repo was `src/winaudio/mod.rs` (WASAPI session control of nrsc5's
# libao output), which was retired by the cpal refactor. If a future
# feature needs raw WASAPI / COM access, re-add the crate with only the
# features it actually uses — previously we carried `Win32_Media_Audio`,
# `Win32_System_Com`, `Win32_System_Com_StructuredStorage`,
# `Win32_System_Variant`, and `Win32_UI_Shell_PropertiesSystem`, all
# transitively unused after winaudio went away.

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[build-dependencies]
bindgen = "0.72"
# Used by build.rs to procedurally generate a multi-resolution Windows icon
# and embed it as a resource in the final .exe. Only active on Windows
# targets — see build.rs for the cfg gate.
image = { version = "0.25", default-features = false }
ico = "0.4"
embed-resource = "3"

[profile.release]
opt-level = "z"      # Optimize for size
lto = true           # Link-time optimization
codegen-units = 1    # Better optimization (slower compile, smaller binary)
strip = true         # Strip debug symbols
panic = "abort"      # No unwinding (smaller binary; fine for a GUI app)

# Debug builds optimize third-party dependencies even though our own
# code stays unoptimized. Real-time DSP (rubato resampler at 2 MHz
# CS16) and the SoapySDR FFI shims can't keep up with the SDRplay's
# 4 MB/s USB stream when compiled at opt-level=0 — the SDR's internal
# buffer overflows continuously and prints `O`s to stderr forever.
# Setting opt-level=3 just for dependencies gives a clean dev build
# (debuggable application code, fast dependencies) without forcing
# the user into release mode for every smoke test.
[profile.dev.package."*"]
opt-level = 3
