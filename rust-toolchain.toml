[toolchain]
# Pin the stable release channel without a host-specific suffix so this file
# works on both Windows and Linux. On Windows, cargo-gnu.ps1 / build.rs still
# select the gnullvm target explicitly; on Linux the host triple is resolved
# automatically by rustup.  The Windows-gnullvm toolchain is installed
# separately by cargo-gnu.ps1 when needed — it doesn't need to be the default.
channel = "stable"
